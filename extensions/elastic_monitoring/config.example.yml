---
# Copy to config.local.yml. Never place real secrets here.
monitoring_elastic_version: "9.5.3"
monitoring_fleet_url: "https://fleet.example.test:8220"
monitoring_elasticsearch_url: "https://elastic.example.test:9200"
monitoring_kibana_url: "https://kibana.example.test:5601"

# Explicit inventory aliases; no wildcard or implicit all-host deployment.
monitoring_targets:
  - srv02
monitoring_report_dir: "{{ playbook_dir }}/../.local/reports"
monitoring_min_free_gb: 8

# No Windows changes without this switch. Preflight ignores this switch.
monitoring_apply: false
monitoring_sysmon_enabled: true
monitoring_logging_enabled: true

# Approve exact OS builds for Sysmon only, after reviewing Microsoft support.
# Empty by default: inventory collection works, mutation is blocked.
# Example (not a support assertion): ["17763"] for Server 2019.
monitoring_sysmon_approved_builds: []

# Local policy mode is opt-in. Domain GPO management is NOT implemented yet.
# A domain GPO can override these settings; do not use both as authorities.
monitoring_allow_local_logging: false
monitoring_allow_dc_changes: false
monitoring_allow_existing_collectors: false

# Logging role only enables channels and increases sizes; never shrinks logs
# or changes retention/overwrite semantics in this milestone.
monitoring_event_log_bytes: 134217728
monitoring_security_log_bytes: 268435456

# Generated by scripts/artifacts.py; supply its JSON with a second -e @file.
# monitoring_artifacts:
#   sysmon_zip: /absolute/path/Sysmon.zip
#   sysmon_zip_sha256: <sha256>
#   sysmon_config: /absolute/path/sysmonconfig.xml
#   sysmon_config_sha256: <sha256>
#   hartong_revision: <40-character-commit>
