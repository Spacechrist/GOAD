- name: Validate selected SQL version and instance
  assert:
    that:
      - not ansible_check_mode
      - sql_version in ['MSSQL_2019', 'MSSQL_2022']
      - sql_instance_name is match('^[A-Za-z][A-Za-z0-9_]{0,15}$')

- name: Select SQL deployment settings
  set_fact:
    download_url: "{{ download_url_2022 if sql_version == 'MSSQL_2022' else download_url_2019 }}"
    connection_type: "{{ connection_type_2022 if sql_version == 'MSSQL_2022' else connection_type_2019 }}"
    mssql_service_name: "{{ 'MSSQLSERVER' if sql_instance_name == 'MSSQLSERVER' else 'MSSQL$' + sql_instance_name }}"
    mssql_instance_id: "{{ ('MSSQL16.' if sql_version == 'MSSQL_2022' else 'MSSQL15.') + sql_instance_name }}"

- name: Inspect existing SQL service
  win_service:
    name: '{{ mssql_service_name }}'
  register: mssql_existing

- name: Refuse orphaned system databases before installation
  win_stat:
    path: 'C:\Program Files\Microsoft SQL Server\{{ mssql_instance_id }}\MSSQL\DATA\master.mdf'
  register: mssql_master

- name: Require explicit recovery for orphaned system databases
  assert:
    that: (mssql_existing.exists | bool) or not (mssql_master.stat.exists | bool)
    fail_msg: 'System databases exist without a registered service. Preserve files and use SQL Setup recovery; automatic deletion/reinstallation is disabled.'

- name: Verify existing instance before accepting it as installed
  include_tasks: health.yml
  when: mssql_existing.exists | bool

- name: Install a missing database engine
  when: not (mssql_existing.exists | bool)
  block:
    - name: Reboot before fresh SQL installation
      win_reboot:
        reboot_timeout: 1200

    - name: Create installation staging directory
      win_file:
        path: 'C:\setup\mssql\media'
        state: directory

    - name: Protect credential-bearing staging directory
      win_shell: |
        $path = 'C:\setup\mssql'
        $acl = Get-Acl -LiteralPath $path
        $acl.SetAccessRuleProtection($true, $false)
        foreach ($rule in @($acl.Access)) { [void]$acl.RemoveAccessRuleSpecific($rule) }
        foreach ($sid in @('S-1-5-18', 'S-1-5-32-544')) {
            $identity = New-Object System.Security.Principal.SecurityIdentifier($sid)
            $rule = New-Object System.Security.AccessControl.FileSystemAccessRule($identity, 'FullControl', 'ContainerInherit,ObjectInherit', 'None', 'Allow')
            $acl.AddAccessRule($rule)
        }
        Set-Acl -LiteralPath $path -AclObject $acl

    - name: Acquire current verified SQL launcher
      include_role:
        name: verified_installer
      vars:
        installer_url: '{{ download_url }}'
        installer_destination: 'C:\setup\mssql\sql_installer.exe'
        installer_minimum_version: "{{ sql_launcher_minimum_2022 if sql_version == 'MSSQL_2022' else sql_launcher_minimum_2019 }}"
        installer_version_pattern: "{{ '^16\\.' if sql_version == 'MSSQL_2022' else '^15\\.' }}"
        installer_original_name: "{{ 'SQL2022-SSEI-Eval.exe' if sql_version == 'MSSQL_2022' else 'SQL2019-SSEI-Expr.exe' }}"
        installer_sha256: "{{ sql_launcher_sha256_2022 if sql_version == 'MSSQL_2022' else sql_launcher_sha256_2019 }}"
        installer_refresh: '{{ sql_refresh_installer }}'

    - name: Render SQL configuration privately
      win_template:
        src: files/sql_conf.ini.{{ sql_version }}.j2
        dest: 'C:\setup\mssql\sql_conf.ini'
      no_log: true

    - name: Grant the configured service account its service logon right
      win_user_right:
        name: SeServiceLogonRight
        users:
          - '{{ SQLSVCACCOUNT }}'
        action: add
      when: SQLSVCACCOUNT != "NT AUTHORITY\\NETWORK SERVICE"

    - name: Install the database once with a time limit
      win_command: 'C:\setup\mssql\sql_installer.exe /configurationfile=C:\setup\mssql\sql_conf.ini /IACCEPTSQLSERVERLICENSETERMS /MEDIAPATH=C:\setup\mssql\media /QUIET /HIDEPROGRESSBAR'
      async: '{{ sql_install_timeout }}'
      poll: 15
      become: true
      become_method: runas
      become_user: '{{ domain_admin }}'
      vars:
        ansible_become_password: '{{ domain_admin_password }}'
        ansible_become_flags: logon_type=interactive logon_flags=with_profile
      register: mssqlinstall
      failed_when: mssqlinstall.rc | default(-1) not in [0, 3010]
      no_log: true

    - name: Reboot if SQL installation requested it
      win_reboot:
        reboot_timeout: 1200
      when: mssqlinstall.rc == 3010

    - name: Verify system databases after installation
      include_tasks: health.yml
  rescue:
    - name: Stop for SQL recovery instead of replaying installation
      fail:
        msg: 'SQL installation or recovery failed. Inspect C:\Program Files\Microsoft SQL Server\150 (or 160)\Setup Bootstrap\Log and SSEI\LogFiles plus the instance ERRORLOG. Preserve system databases; do not automatically delete or reinstall.'
  always:
    - name: Remove rendered credentials after the installation attempt
      win_file:
        path: 'C:\setup\mssql\sql_conf.ini'
        state: absent
      no_log: true

- name: Enable TCP and remove dynamic ports on the selected SQL instance
  win_regedit:
    path: 'HKLM:\Software\Microsoft\Microsoft SQL Server\{{ mssql_instance_id }}\MSSQLServer\SuperSocketNetLib\Tcp'
    name: '{{ item.name }}'
    data: '{{ item.data }}'
    type: dword
  loop:
    - { name: Enabled, data: 1 }
    - { name: ListenOnAllIPs, data: 1 }
  register: sql_tcp

- name: Configure the fixed SQL port
  win_regedit:
    path: 'HKLM:\Software\Microsoft\Microsoft SQL Server\{{ mssql_instance_id }}\MSSQLServer\SuperSocketNetLib\Tcp\IPAll'
    name: '{{ item.name }}'
    data: '{{ item.data }}'
    type: string
  loop:
    - { name: TcpDynamicPorts, data: '' }
    - { name: TcpPort, data: '1433' }
  register: sql_ports

- name: Restart SQL only when listener settings changed
  win_service:
    name: '{{ mssql_service_name }}'
    state: restarted
  when: sql_tcp.changed or sql_ports.changed

- name: Firewall | Allow MSSQL through Firewall
  win_dsc:
    resource_name: xFirewall
    Name: "Access for MSSQL (TCP-In)"
    Ensure: present
    Enabled: True
    Profile: "Domain"
    Direction: "Inbound"
    Localport: "1433"
    Protocol: "TCP"
    Description: "Opens the listener port for MSSQL"

- name: Firewall | Allow MSSQL discover through Firewall
  win_dsc:
    resource_name: xFirewall
    Name: "Access for MSSQL (UDP-In)"
    Ensure: present
    Enabled: True
    Profile: "Domain"
    Direction: "Inbound"
    Localport: "1434"
    Protocol: "UDP"
    Description: "Opens the discover port for MSSQL"

- name: Be sure service is started
  win_service:
    name: '{{mssql_service_name}}'
    force_dependent_services: yes
    state: started

- name: Wait for port 1433 to become open on the host, start checking every 5 seconds
  ansible.windows.win_wait_for:
    port: 1433
    delay: 5

- name: Add MSSQL admin
  win_shell: |
    SqlCmd {{connection_type}} -Q "CREATE LOGIN [{{item}}] FROM WINDOWS"
    SqlCmd {{connection_type}} -Q "SP_ADDSRVROLEMEMBER '{{item}}','SYSADMIN'"
  become: yes
  become_method: runas
  become_user: "{{SQLSVCACCOUNT}}"
  vars:
    ansible_become_pass: "{{SQLSVCPASSWORD}}"
  loop: "{{sql_sysadmins}}"

- name: Add IMPERSONATE on login
  win_shell: |
    SqlCmd {{connection_type}} -Q "CREATE LOGIN [{{item.key}}] FROM WINDOWS"
    SqlCmd {{connection_type}} -Q "GRANT IMPERSONATE ON LOGIN::[{{item.value}}] TO [{{item.key}}]"
  become: yes
  become_method: runas
  become_user: "{{SQLSVCACCOUNT}}"
  vars:
    ansible_become_pass: "{{SQLSVCPASSWORD}}"
  with_dict: "{{executeaslogin}}"

- name: Add IMPERSONATE on user
  win_shell: |
    SqlCmd {{connection_type}} -Q "CREATE LOGIN [{{item.key}}] FROM WINDOWS"
    SqlCmd {{connection_type}} -Q "USE {{item.value.db}};CREATE USER [{{item.value.user}}] FOR LOGIN [{{item.value.user}}]"
    SqlCmd {{connection_type}} -Q "USE {{item.value.db}};GRANT IMPERSONATE ON USER::[{{item.value.impersonate}}] TO [{{item.value.user}}]"
  become: yes
  become_method: runas
  become_user: "{{SQLSVCACCOUNT}}"
  vars:
    ansible_become_pass: "{{SQLSVCPASSWORD}}"
  with_dict: "{{executeasuser}}"

- name: Enable sa account
  win_shell: |
    SqlCmd {{connection_type}} -Q "ALTER LOGIN sa ENABLE"
    SqlCmd {{connection_type}} -Q "ALTER LOGIN sa WITH PASSWORD = '{{sa_password}}' , CHECK_POLICY=OFF"
  become: yes
  become_method: runas
  become_user: "{{SQLSVCACCOUNT}}"
  vars:
    ansible_become_pass: "{{SQLSVCPASSWORD}}"

- name: enable MSSQL authentication and windows authent
  win_shell: |
    SqlCmd {{connection_type}} -Q "EXEC xp_instance_regwrite N'HKEY_LOCAL_MACHINE', N'Software\Microsoft\MSSQLServer\MSSQLServer', N'LoginMode', REG_DWORD, 2"
  become: yes
  become_method: runas
  become_user: "{{SQLSVCACCOUNT}}"
  vars:
    ansible_become_pass: "{{SQLSVCPASSWORD}}"

- name: Restart service MSSQL
  win_service:
    name: '{{mssql_service_name}}'
    force_dependent_services: yes
    state: restarted


- name: Verify sustained SQL health after role configuration
  include_tasks: health.yml
